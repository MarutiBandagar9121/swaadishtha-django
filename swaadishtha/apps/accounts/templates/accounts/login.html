{% extends 'base.html'%}

{% block title %}Login - Swaadistha{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">

    <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-md">

        <h1 class="text-2xl font-semibold mb-6 text-center">
            Login to Swaadistha
        </h1>

        {% if error %}
        <div class="bg-red-100 text-red-700 p-2 mb-4 rounded">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">

            {% csrf_token %}

            <div>
                <label class="block text-sm mb-1">Email</label>
                <input type="email" name="email" required class="w-full border rounded-lg px-3 py-2">
            </div>

            <div>
                <label class="block text-sm mb-1">Password</label>
                <input type="password" name="password" required class="w-full border rounded-lg px-3 py-2">
            </div>

            <button type="submit" class="w-full bg-black text-white py-2 rounded-lg">
                Login
            </button>

        </form>
        <!-- Signup Link -->
        <p class="text-sm text-center text-gray-600 mt-6">
            Dont have an account?
            <a href="{% url 'register' %}" class="text-blue-600 hover:underline">
                Register
            </a>
        </p>
    </div>
</div>
{% endblock %}
