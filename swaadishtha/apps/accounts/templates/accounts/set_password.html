{% extends "base.html" %}

{% block title %}Set Password - Swaadistha{% endblock %}

{% block content %}

<div class="flex items-center justify-center min-h-[75vh]">

    <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-md">

        <h1 class="text-2xl font-semibold text-center mb-2">
            Set your password
        </h1>

        <p class="text-sm text-gray-500 text-center mb-6">
            Create a secure password for your account
        </p>

        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'set-password' %}" class="space-y-4" id="passwordForm">

            {% csrf_token %}

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium mb-1">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2"
                >
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-sm font-medium mb-1">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2"
                >
            </div>

            <!-- Password error -->
            <p id="passwordError" class="text-red-600 text-sm hidden">
                Passwords do not match
            </p>

            <button
                type="submit"
                class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition"
            >
                Create Account
            </button>

        </form>

    </div>

</div>

<script>

const form = document.getElementById("passwordForm")
const password = document.getElementById("password")
const confirmPassword = document.getElementById("confirm_password")
const error = document.getElementById("passwordError")

form.addEventListener("submit", function(e){

    if(password.value !== confirmPassword.value){
        e.preventDefault()
        error.classList.remove("hidden")
    }

    if(password.value.length < 8){
    e.preventDefault()
    error.innerText = "Password must be at least 8 characters"
    error.classList.remove("hidden")
}

})

</script>

{% endblock %}
