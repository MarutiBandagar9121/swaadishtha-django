{% load static %}
<article class="group cursor-pointer">

    <!-- Image area with hover overlay CTA -->
    <div class="relative aspect-3/4 rounded-2xl overflow-hidden mb-3">

        {% if product.images.first %}
        <img src="{{ product.images.first.image.url }}"
             alt="{{ product.images.first.alt_text|default:product.name }}"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        {% else %}
        <!-- Placeholder image -->
        <img src="{% static 'images/swaadishtha_placeholder_image.png' %}" alt="{{ product.name }}"
             class="w-full h-full object-cover">
        {% endif %}

        <!-- Optional badge (pass badge="Best Seller" etc.) -->
        {% if badge %}
        <div class="absolute top-3 left-3 bg-[rgb(var(--color-accent))] text-white text-[10px] font-semibold tracking-wide uppercase px-2.5 py-1 rounded-lg">
            {{ badge }}
        </div>
        {% endif %}

        <!-- Hover overlay with CTA -->
        <div class="absolute inset-0 bg-[rgb(var(--color-primary))]/0 group-hover:bg-[rgb(var(--color-primary))]/60 transition-all duration-300 flex items-center justify-center">
            <a href="#"
               class="bg-white text-[rgb(var(--color-primary))] text-xs font-semibold px-5 py-2.5 rounded-xl opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all duration-300">
                View Product
            </a>
        </div>

    </div>

    <!-- Info below image -->
    <h3 class="text-sm font-medium text-[rgb(var(--color-heading))] leading-snug">{{ product.name }}</h3>

    {% if product.min_price %}
    <p class="text-[rgb(var(--color-accent))] text-sm font-semibold mt-1">From &#8377;{{ product.min_price }}</p>
    {% endif %}

</article>
